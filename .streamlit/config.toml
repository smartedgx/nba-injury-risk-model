# Streamlit theme: light theme modeled on nba.com's design system.
#
# Why a config file in addition to the CSS in dashboard/app.py:
# Streamlit draws dataframes on a <canvas>, which CSS can't reach. The table
# header colors, borders and widget accent colors come from these settings.
#
# Streamlit reads this file from the folder you launch it in, so run the app
# from the repository root:  streamlit run dashboard/app.py

[theme]
base = "light"
primaryColor = "#1d428a"                   # nba navy
backgroundColor = "#f6f6f6"                # cotton (page background)
secondaryBackgroundColor = "#ffffff"       # white cards
textColor = "#222222"                      # minotaur
borderColor = "#e7e7e7"                    # concrete
dataframeHeaderBackgroundColor = "#0b1b2c" # nba dark blue (stats table header)
dataframeHeaderTextColor = "#ffffff"       # white header text (needed: default dark text is unreadable on navy)
font = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Barlow+Condensed:wght@600;700&display=swap, sans-serif"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f6"
